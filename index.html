<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner HD Rapido</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto}
.header{padding:14px 16px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
.camera{position:relative;width:100%;height:60vh;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover}
.guide{position:absolute;inset:7%;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,0.6)}
.controls{padding:16px;background:#111;display:flex;justify-content:center;gap:32px}
.btn-cap{width:82px;height:82px;background:#fff;border-radius:50%;border:7px solid #2a2a2a;color:#111;font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-mini{width:48px;height:48px;background:#1e1e1e;border:1px solid #333;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.filters{display:flex;gap:8px;padding:10px 12px;background:#151515;overflow-x:auto}
.filter{padding:7px 14px;border-radius:20px;background:#1e1e1e;border:1.5px solid #333;font-size:11px;font-weight:700;white-space:nowrap}
.filter.active{background:#00ff88;color:#111;border-color:#00ff88}
#editor,#preview{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.edit-top{padding:12px 16px;background:#111;display:flex;justify-content:space-between;align-items:center}
.edit-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:#0f0f0f;padding:10px}
#editCanvas{max-width:100%;max-height:68vh;background:#fff;border-radius:10px}
.corner{position:absolute;width:34px;height:34px;background:#fff;border:3px solid #00ff88;border-radius:50%;transform:translate(-50%,-50%);z-index:10}
.pdf-wrap{flex:1;overflow-y:auto;background:#2f2f2f;padding:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
.pdf-card{width:100%;max-width:380px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.5)}
.pdf-card img{width:100%;display:block}
.actions{padding:12px;background:#111;display:flex;gap:10px;border-top:1px solid #222}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-c{background:#1e1e1e;color:#fff;border:1px solid #333}
.btn-s{background:#00ff88;color:#111}
.btn-wa{background:#25D366;color:#fff}
.pages{padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.page{background:#fff;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:3/4}
.page img{width:100%;height:100%;object-fit:contain;background:#fff}
.page-del{position:absolute;top:6px;right:6px;width:26px;height:26px;background:#ef4444;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.page-num{position:absolute;bottom:6px;left:6px;background:#111;color:#fff;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:800}
.bottom{position:sticky;bottom:0;background:#111;padding:12px;display:flex;gap:10px;border-top:1px solid #222}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><h1><i class="fa-solid fa-bolt"></i> Scanner Rapido</h1><span id="count" style="font-size:11px;background:#00ff88;color:#111;padding:4px 10px;border-radius:20px;font-weight:800">0 hojas</span></div>
<div class="camera"><video id="video" autoplay playsinline muted></video><div class="guide"></div></div>
<div class="controls">
  <button class="btn-mini" onclick="fileInput.click()"><i class="fa-solid fa-images"></i></button>
  <button class="btn-cap" onclick="tomarFoto()"><i class="fa-solid fa-camera"></i></button>
  <button class="btn-mini" onclick="cambiarCamara()"><i class="fa-solid fa-rotate"></i></button>
  <input id="fileInput" type="file" accept="image/*" hidden>
</div>
<div class="filters">
  <div class="filter active" data-m="magic" onclick="setMode('magic')">Magic HD</div>
  <div class="filter" data-m="bw" onclick="setMode('bw')">B&W</div>
  <div class="filter" data-m="light" onclick="setMode('light')">Aclarar</div>
  <div class="filter" data-m="original" onclick="setMode('original')">Original</div>
</div>
<div class="pages"><div style="display:flex;justify-content:space-between"><b style="font-size:12px">DOCUMENTO</b><span style="font-size:10px;color:#00ff88">Rapido y HD</span></div><div class="grid" id="grid"></div></div>
<div class="bottom"><button class="btn btn-c" onclick="vistaPrevia()" style="background:#fff;color:#111"><i class="fa-solid fa-eye"></i> Ver PDF</button><button class="btn btn-wa" onclick="vistaPrevia()"><i class="fa-brands fa-whatsapp"></i> Enviar</button></div>

<div id="editor">
  <div class="edit-top"><b style="font-size:12px">Ajusta bordes - Rapido</b><span style="font-size:10px;background:#00ff88;color:#111;padding:4px 8px;border-radius:20px">Sin lag</span></div>
  <div class="edit-wrap" id="editWrap"><canvas id="editCanvas"></canvas><div class="corner" id="p0"></div><div class="corner" id="p1"></div><div class="corner" id="p2"></div><div class="corner" id="p3"></div></div>
  <div style="padding:8px;background:#111;display:flex;gap:8px"><button class="btn btn-c" style="flex:none;padding:8px 12px;font-size:11px" onclick="autoDetectar()">Auto</button><button class="btn btn-c" style="flex:none;padding:8px 12px;font-size:11px" onclick="rotarFast()">Rotar</button></div>
  <div class="actions"><button class="btn btn-c" onclick="cerrarEditor()">Cancelar</button><button class="btn btn-s" onclick="previewHD()"><i class="fa-solid fa-eye"></i> Ver cómo queda</button></div>
</div>

<div id="preview">
  <div class="edit-top"><b id="prevTitle" style="font-size:12px">Preview HD</b><button onclick="preview.style.display='none'" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:20px">X</button></div>
  <div class="pdf-wrap" id="pdfWrap"></div>
  <div class="actions" id="actionBtns"></div>
</div>

<canvas id="cap" class="hidden"></canvas>
<canvas id="work" class="hidden"></canvas>
<canvas id="small" class="hidden"></canvas>

<script>
let stream=null, facing='environment', paginas=[], puntos=[{x:0.07,y:0.07},{x:0.93,y:0.07},{x:0.93,y:0.93},{x:0.07,y:0.93}], imgOrig=null, drag=-1, mode='magic', tempHD=null;

async function iniciar(){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}}}); video.srcObject=stream; } iniciar();
function cambiarCamara(){ facing=facing==='environment'?'user':'environment'; iniciar(); }
function setMode(m){ mode=m; document.querySelectorAll('.filter').forEach(f=>f.classList.remove('active')); document.querySelector(`[data-m="${m}"]`).classList.add('active'); }

function tomarFoto(){ let c=cap; c.width=video.videoWidth; c.height=video.videoHeight; c.getContext('2d').drawImage(video,0,0); abrirEditor(c.toDataURL('image/jpeg',0.92)); }
fileInput.addEventListener('change', e=>{ let f=e.target.files[0]; let r=new FileReader(); r.onload=()=>abrirEditor(r.result); r.readAsDataURL(f); });

function abrirEditor(src){ imgOrig=new Image(); imgOrig.src=src; imgOrig.onload=()=>{ editor.style.display='flex'; setTimeout(()=>{ dibujar(); autoDetectar(); },60); } }
function cerrarEditor(){ editor.style.display='none'; }
function dibujar(){
  let c=editCanvas, w=editWrap;
  // preview pequeño para que no haya lag
  let maxW=600, maxH=800;
  let sc=Math.min(maxW/imgOrig.width, maxH/imgOrig.height);
  small.width=imgOrig.width*sc; small.height=imgOrig.height*sc;
  small.getContext('2d').drawImage(imgOrig,0,0,small.width,small.height);
  let sc2=Math.min((w.clientWidth-20)/small.width, (w.clientHeight-100)/small.height);
  c.width=small.width*sc2; c.height=small.height*sc2;
  c.getContext('2d').drawImage(small,0,0,c.width,c.height);
  actualizar();
}
function actualizar(){
  let c=editCanvas;
  puntos.forEach((p,i)=>{ let el=document.getElementById('p'+i); el.style.left=(c.offsetLeft+p.x*c.width)+'px'; el.style.top=(c.offsetTop+p.y*c.height)+'px'; });
  let ctx=c.getContext('2d'); ctx.drawImage(small,0,0,c.width,c.height);
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=2.5; ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(puntos[0].x*c.width,puntos[0].y*c.height);
  for(let i=1;i<4;i++) ctx.lineTo(puntos[i].x*c.width,puntos[i].y*c.height); ctx.closePath(); ctx.stroke();
}
document.querySelectorAll('.corner').forEach((el,i)=>{ el.addEventListener('touchstart',()=>drag=i); el.addEventListener('mousedown',()=>drag=i); });
window.addEventListener('touchmove', e=>{ if(drag==-1) return; e.preventDefault(); let c=editCanvas,r=c.getBoundingClientRect(); puntos[drag]={x:(e.touches[0].clientX-r.left)/c.width,y:(e.touches[0].clientY-r.top)/c.height}; actualizar(); },{passive:false});
window.addEventListener('mousemove', e=>{ if(drag==-1) return; let c=editCanvas,r=c.getBoundingClientRect(); puntos[drag]={x:(e.clientX-r.left)/c.width,y:(e.clientY-r.top)/c.height}; actualizar(); });
window.addEventListener('touchend',()=>drag=-1); window.addEventListener('mouseup',()=>drag=-1);

function autoDetectar(){
  if(typeof cv==='undefined') return;
  try{
    let src=cv.imread(small), gray=new cv.Mat(); cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
    let edges=new cv.Mat(); cv.Canny(gray,edges,50,150);
    let cont=new cv.MatVector(), hier=new cv.Mat(); cv.findContours(edges,cont,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    let maxA=0,best=null; for(let i=0;i<cont.size();i++){ let cnt=cont.get(i); let area=cv.contourArea(cnt); if(area>src.rows*src.cols*0.12 && area>maxA){ let peri=cv.arcLength(cnt,true); let ap=new cv.Mat(); cv.approxPolyDP(cnt,ap,0.02*peri,true); if(ap.rows==4){maxA=area; best=ap;} } }
    if(best){ let pts=[]; for(let i=0;i<4;i++) pts.push({x:best.data32S[i*2]/src.cols,y:best.data32S[i*2+1]/src.rows}); pts.sort((a,b)=>a.y-b.y); let t=pts.slice(0,2).sort((a,b)=>a.x-b.x), b=pts.slice(2,4).sort((a,b)=>a.x-b.x); puntos=[t[0],t[1],b[1],b[0]]; actualizar(); }
    src.delete(); gray.delete(); edges.delete(); cont.delete(); hier.delete();
  }catch(e){}
}
function rotarFast(){
  let c=small, t=document.createElement('canvas'); t.width=c.height; t.height=c.width;
  t.getContext('2d').translate(t.width/2,t.height/2); t.getContext('2d').rotate(90*Math.PI/180); t.getContext('2d').drawImage(c,-c.width/2,-c.height/2);
  small.width=t.width; small.height=t.height; small.getContext('2d').drawImage(t,0,0);
  // también rotar cap en alta
  let capC=cap, tc=document.createElement('canvas'); tc.width=capC.height; tc.height=capC.width;
  tc.getContext('2d').translate(tc.width/2,tc.height/2); tc.getContext('2d').rotate(90*Math.PI/180); tc.getContext('2d').drawImage(capC,-capC.width/2,-capC.height/2);
  capC.width=tc.width; capC.height=tc.height; capC.getContext('2d').drawImage(tc,0,0);
  puntos=[{x:0.07,y:0.07},{x:0.93,y:0.07},{x:0.93,y:0.93},{x:0.07,y:0.93}];
  dibujar();
}

function aplicarFiltro(canvas){
  let ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height, img=ctx.getImageData(0,0,W,H), d=img.data;
  for(let i=0;i<d.length;i+=4){
    let v=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
    if(mode==='magic'){ if(v>185) d[i]=d[i+1]=d[i+2]=255; else { d[i]*=0.85; d[i+1]*=0.85; d[i+2]*=0.85; } }
    else if(mode==='bw'){ let bw=v>135?255:0; d[i]=d[i+1]=d[i+2]=bw; }
    else if(mode==='light'){ v=(v-128)*1.5+128+20; if(v>190) v=255; d[i]=d[i+1]=d[i+2]=Math.min(255,Math.max(0,v)); }
  }
  ctx.putImageData(img,0,0);
}

function procesarHD(){
  let srcC=cap, dst=work, W=2480, H=3508; dst.width=W; dst.height=H;
  let scaleX=srcC.width/small.width, scaleY=srcC.height/small.height;
  let pts=puntos.map(p=>({x:p.x*small.width*scaleX, y:p.y*small.height*scaleY}));
  try{
    let srcMat=cv.imread(srcC), dstMat=new cv.Mat();
    let s=cv.matFromArray(4,1,cv.CV_32FC2,[pts[0].x,pts[0].y,pts[1].x,pts[1].y,pts[2].x,pts[2].y,pts[3].x,pts[3].y]);
    let d=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W,0,W,H,0,H]);
    let M=cv.getPerspectiveTransform(s,d);
    cv.warpPerspective(srcMat,dstMat,M,new cv.Size(W,H),cv.INTER_CUBIC,cv.BORDER_REPLICATE);
    cv.imshow(dst,dstMat); srcMat.delete(); dstMat.delete(); s.delete(); d.delete(); M.delete();
  }catch(e){ dst.getContext('2d').drawImage(srcC,0,0,W,H); }
  aplicarFiltro(dst);
  return dst.toDataURL('image/jpeg',1.0);
}

function previewHD(){
  tempHD=procesarHD();
  preview.style.display='flex';
  prevTitle.innerText='Así quedará - HD Nítido';
  pdfWrap.innerHTML=`<div class="pdf-card"><img src="${tempHD}"></div><div style="color:#fff;font-size:11px;background:#222;padding:10px 14px;border-radius:20px;text-align:center">Preview real HD - Sin borroso - Centrada</div>`;
  actionBtns.innerHTML=`
    <button class="btn btn-c" onclick="preview.style.display='none'"><i class="fa-solid fa-arrow-left"></i> Ajustar</button>
    <button class="btn btn-c" style="background:#fff;color:#111" onclick="guardarYAgregar()"><i class="fa-solid fa-plus"></i> Guardar y agregar otra</button>
    <button class="btn btn-s" onclick="guardarYEnviar()"><i class="fa-solid fa-check"></i> Guardar</button>`;
}
function guardarYAgregar(){
  paginas.push(tempHD); render();
  preview.style.display='none'; cerrarEditor();
  setTimeout(()=>tomarFoto(),300);
}
function guardarYEnviar(){
  paginas.push(tempHD); render();
  preview.style.display='none'; cerrarEditor();
  setTimeout(()=>vistaPrevia(),400);
}

function render(){ grid.innerHTML=paginas.map((s,i)=>`<div class="page"><img src="${s}"><div class="page-num">${i+1} HD</div><div class="page-del" onclick="paginas.splice(${i},1);render()"><i class="fa-solid fa-xmark"></i></div></div>`).join(''); count.innerText=paginas.length+' hojas HD'; }

function vistaPrevia(){
  if(!paginas.length) return alert('Toma una hoja primero');
  preview.style.display='flex';
  prevTitle.innerText=`PDF ${paginas.length} páginas - Vista real`;
  pdfWrap.innerHTML=paginas.map((s,i)=>`<div class="pdf-card"><img src="${s}"><div style="position:absolute;top:6px;left:6px;background:#111;color:#fff;font-size:10px;padding:4px 8px;border-radius:20px">Página ${i+1}</div></div>`).join('');
  actionBtns.innerHTML=`
    <button class="btn btn-c" onclick="preview.style.display='none'"><i class="fa-solid fa-xmark"></i> Cerrar</button>
    <button class="btn btn-c" style="background:#fff;color:#111" onclick="agregarOtraDesdePreview()"><i class="fa-solid fa-plus"></i> Agregar otra imagen</button>
    <button class="btn btn-wa" onclick="enviarWA()"><i class="fa-brands fa-whatsapp"></i> Enviar WhatsApp</button>`;
}
function agregarOtraDesdePreview(){ preview.style.display='none'; setTimeout(()=>tomarFoto(),200); }
async function enviarWA(){
  const {jsPDF}=window.jspdf; let pdf=new jsPDF('p','mm','a4');
  paginas.forEach((s,i)=>{ if(i>0) pdf.addPage(); pdf.addImage(s,'JPEG',0,0,210,297,undefined,'FAST'); });
  let blob=pdf.output('blob'), file=new File([blob],`Documento_HD.pdf`,{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Documento HD'}); }
  else { let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=file.name; a.click(); setTimeout(()=>window.open('https://wa.me/?text=Te envío el PDF HD','_blank'),400); }
}
</script>
</body>
</html>
