<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner Pro - Recorte Auto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f0f0f;color:#fff;max-width:500px;margin:0 auto;min-height:100vh}
.header{background:#111;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:20}
.camera-box{position:relative;width:100%;height:62vh;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;inset:8%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 1000px rgba(0,0,0,0.5)}
.scan-frame::after{content:'Centra la hoja aquí';position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff;color:#111;padding:4px 12px;border-radius:20px;font-weight:700}
.controls{padding:14px;background:#111;display:flex;justify-content:center;align-items:center;gap:24px}
.btn-cap{width:76px;height:76px;background:#fff;border-radius:50%;border:8px solid #2a2a2a;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#111;font-size:28px;box-shadow:0 4px 20px rgba(255,255,255,0.2)}
.btn-mini{width:46px;height:46px;background:#1e1e1e;border-radius:50%;border:1px solid #333;color:#fff;display:flex;align-items:center;justify-content:center}

/* Editor recorte */
#editorOverlay{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.editor-top{padding:12px 16px;background:#111;display:flex;justify-content:space-between;align-items:center}
.editor-canvas-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
#editCanvas{max-width:100%;max-height:100%;touch-action:none}
.corner{position:absolute;width:28px;height:28px;background:#fff;border:3px solid #5c0f2a;border-radius:50%;transform:translate(-50%,-50%);z-index:10;touch-action:none}
.editor-actions{padding:12px;background:#111;display:flex;gap:10px;border-top:1px solid #222}
.btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-cancel{background:#1e1e1e;color:#fff;border:1px solid #333}
.btn-confirm{background:#fff;color:#111}

.filters{display:flex;gap:8px;padding:10px 12px;background:#151515;overflow-x:auto}
.filter{padding:6px 14px;border-radius:20px;background:#1e1e1e;border:1px solid #333;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
.filter.active{background:#fff;color:#111}

.pages{padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.page-card{position:relative;background:#1e1e1e;border-radius:12px;overflow:hidden;border:1px solid #2a2a2a;aspect-ratio:3/4}
.page-card img{width:100%;height:100%;object-fit:cover}
.page-del{position:absolute;top:4px;right:4px;width:22px;height:22px;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer}
.page-num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,0.7);font-size:9px;padding:2px 6px;border-radius:10px}
.bottom{position:sticky;bottom:0;background:#111;padding:12px;display:flex;gap:10px;border-top:1px solid #222}
.btn-pdf{background:#fff;color:#111}
.btn-wa{background:#25D366;color:#fff}
canvas.hidden{display:none}
</style>
</head>
<body>
<div class="header"><h1><i class="fa-solid fa-file-lines"></i> Scanner Hoja</h1><span id="countPag">0 hojas</span></div>

<div class="camera-box">
  <video id="video" autoplay playsinline></video>
  <div class="scan-frame"></div>
</div>

<div class="controls">
  <button class="btn-mini" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-images"></i></button>
  <button class="btn-cap" onclick="tomarFoto()"><i class="fa-solid fa-camera"></i></button>
  <button class="btn-mini" onclick="cambiarCamara()"><i class="fa-solid fa-rotate"></i></button>
  <input type="file" id="fileInput" accept="image/*" hidden>
</div>

<div class="filters">
  <div class="filter active" data-f="documento" onclick="setFiltro('documento')">Natural</div>
  <div class="filter" data-f="bn" onclick="setFiltro('bn')">B/N Puro</div>
  <div class="filter" data-f="gris" onclick="setFiltro('gris')">Texto</div>
  <div class="filter" data-f="original" onclick="setFiltro('original')">Original</div>
</div>

<div class="pages">
  <div style="font-size:12px;font-weight:800;display:flex;justify-content:space-between"><span><i class="fa-solid fa-layer-group"></i> Documento: <span id="txtPag">0 páginas</span></span><span style="font-size:10px;color:#888">Recortadas y limpias</span></div>
  <div class="grid" id="gridPages"></div>
</div>

<div class="bottom">
  <button class="btn btn-pdf" onclick="generarPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
  <button class="btn btn-wa" onclick="compartirWhatsApp()"><i class="fa-brands fa-whatsapp"></i> Enviar</button>
</div>

<!-- Editor de recorte -->
<div id="editorOverlay">
  <div class="editor-top">
    <b style="font-size:13px">Ajusta los bordes de la hoja</b>
    <span style="font-size:10px;background:#222;padding:4px 8px;border-radius:10px">Arrastra las esquinas</span>
  </div>
  <div class="editor-canvas-wrap" id="wrap">
    <canvas id="editCanvas"></canvas>
    <div class="corner" id="c0"></div>
    <div class="corner" id="c1"></div>
    <div class="corner" id="c2"></div>
    <div class="corner" id="c3"></div>
  </div>
  <div style="padding:8px 12px;display:flex;gap:8px;background:#111">
    <button class="filter active" onclick="aplicarAutoBordes()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto detectar</button>
    <button class="filter" onclick="rotarEdit()"><i class="fa-solid fa-rotate"></i> Rotar</button>
  </div>
  <div class="editor-actions">
    <button class="btn btn-cancel" onclick="cerrarEditor()"><i class="fa-solid fa-xmark"></i> Cancelar</button>
    <button class="btn btn-confirm" onclick="confirmarRecorte()"><i class="fa-solid fa-check"></i> Confirmar y Guardar</button>
  </div>
</div>

<canvas id="capCanvas" class="hidden"></canvas>
<canvas id="workCanvas" class="hidden"></canvas>

<script>
let stream=null, facing='environment', filtroActual='documento';
let paginas=[];
let puntos=[{x:0.1,y:0.1},{x:0.9,y:0.1},{x:0.9,y:0.9},{x:0.1,y:0.9}];
let imgOriginal=null, editScale=1, dragIdx=-1;

async function iniciarCamara(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:1920}, height:{ideal:1080}}});
  document.getElementById('video').srcObject=stream;
}
iniciarCamara();
function cambiarCamara(){ facing=facing==='environment'?'user':'environment'; iniciarCamara(); }
function setFiltro(f){
  filtroActual=f;
  document.querySelectorAll('.filters.filter').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-f="${f}"]`).classList.add('active');
}

function tomarFoto(){
  let video=document.getElementById('video');
  let c=document.getElementById('capCanvas');
  c.width=video.videoWidth; c.height=video.videoHeight;
  c.getContext('2d').drawImage(video,0,0);
  abrirEditor(c.toDataURL('image/jpeg',0.95));
}
document.getElementById('fileInput').addEventListener('change', e=>{
  let file=e.target.files[0]; if(!file) return;
  let r=new FileReader(); r.onload=()=>abrirEditor(r.result); r.readAsDataURL(file);
});

function abrirEditor(src){
  imgOriginal=new Image(); imgOriginal.src=src;
  imgOriginal.onload=()=>{
    document.getElementById('editorOverlay').style.display='flex';
    setTimeout(()=>{ dibujarEditor(); aplicarAutoBordes(); },100);
  }
}
function cerrarEditor(){ document.getElementById('editorOverlay').style.display='none'; }

function dibujarEditor(){
  let canvas=document.getElementById('editCanvas');
  let wrap=document.getElementById('wrap');
  let maxW=wrap.clientWidth-20, maxH=wrap.clientHeight-20;
  let ratio=Math.min(maxW/imgOriginal.width, maxH/imgOriginal.height);
  canvas.width=imgOriginal.width*ratio;
  canvas.height=imgOriginal.height*ratio;
  editScale=ratio;
  let ctx=canvas.getContext('2d');
  ctx.drawImage(imgOriginal,0,0,canvas.width,canvas.height);
  actualizarCorners();
}
function actualizarCorners(){
  puntos.forEach((p,i)=>{
    let el=document.getElementById('c'+i);
    el.style.left=(p.x*document.getElementById('editCanvas').width)+'px';
    el.style.top=(p.y*document.getElementById('editCanvas').height)+'px';
  });
  dibujarPoligono();
}
function dibujarPoligono(){
  let c=document.getElementById('editCanvas');
  let ctx=c.getContext('2d');
  ctx.drawImage(imgOriginal,0,0,c.width,c.height);
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=3; ctx.setLineDash([8,6]);
  ctx.beginPath();
  ctx.moveTo(puntos[0].x*c.width,puntos[0].y*c.height);
  for(let i=1;i<4;i++) ctx.lineTo(puntos[i].x*c.width,puntos[i].y*c.height);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle='rgba(0,255,136,0.15)'; ctx.fill();
}

// Drag corners
document.querySelectorAll('.corner').forEach((el,idx)=>{
  el.addEventListener('touchstart', e=>{ dragIdx=idx; });
  el.addEventListener('mousedown', e=>{ dragIdx=idx; });
});
window.addEventListener('touchmove', e=>{
  if(dragIdx==-1) return;
  let rect=document.getElementById('editCanvas').getBoundingClientRect();
  let x=(e.touches[0].clientX-rect.left)/rect.width;
  let y=(e.touches[0].clientY-rect.top)/rect.height;
  puntos[dragIdx]={x:Math.max(0,Math.min(1,x)), y:Math.max(0,Math.min(1,y))};
  actualizarCorners();
});
window.addEventListener('touchend', ()=>dragIdx=-1);
window.addEventListener('mousemove', e=>{
  if(dragIdx==-1) return;
  let rect=document.getElementById('editCanvas').getBoundingClientRect();
  puntos[dragIdx]={x:(e.clientX-rect.left)/rect.width, y:(e.clientY-rect.top)/rect.height};
  actualizarCorners();
});
window.addEventListener('mouseup', ()=>dragIdx=-1);

function aplicarAutoBordes(){
  if(typeof cv==='undefined'){ alert('OpenCV cargando, mueve manual por ahora'); return; }
  try{
    let src = cv.imread(document.getElementById('capCanvas'));
    let gray=new cv.Mat(); cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    let blur=new cv.Mat(); cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
    let edges=new cv.Mat(); cv.Canny(blur,edges,75,200);
    let contours=new cv.MatVector(); let hier=new cv.Mat();
    cv.findContours(edges,contours,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
    let maxArea=0, best=null;
    for(let i=0;i<contours.size();i++){
      let cnt=contours.get(i);
      let area=cv.contourArea(cnt);
      if(area>maxArea && area> src.rows*src.cols*0.15){
        let peri=cv.arcLength(cnt,true);
        let approx=new cv.Mat();
        cv.approxPolyDP(cnt,approx,0.02*peri,true);
        if(approx.rows==4){ maxArea=area; best=approx; }
      }
    }
    if(best){
      let pts=[];
      for(let i=0;i<4;i++) pts.push({x:best.data32S[i*2]/src.cols, y:best.data32S[i*2+1]/src.rows});
      // ordenar tl,tr,br,bl
      pts.sort((a,b)=>a.y-b.y);
      let top=pts.slice(0,2).sort((a,b)=>a.x-b.x);
      let bot=pts.slice(2,4).sort((a,b)=>a.x-b.x);
      puntos=[top[0],top[1],bot[1],bot[0]];
      actualizarCorners();
    }
    src.delete(); gray.delete(); blur.delete(); edges.delete(); contours.delete(); hier.delete();
  }catch(e){ console.log(e); }
}

function rotarEdit(){
  let c=document.getElementById('capCanvas');
  let tmp=document.createElement('canvas'); tmp.width=c.height; tmp.height=c.width;
  tmp.getContext('2d').translate(tmp.width/2,tmp.height/2);
  tmp.getContext('2d').rotate(90*Math.PI/180);
  tmp.getContext('2d').drawImage(c,-c.width/2,-c.height/2);
  c.width=tmp.width; c.height=tmp.height; c.getContext('2d').drawImage(tmp,0,0);
  imgOriginal.src=c.toDataURL();
  imgOriginal.onload=()=>{ puntos=[{x:0.1,y:0.1},{x:0.9,y:0.1},{x:0.9,y:0.9},{x:0.1,y:0.9}]; dibujarEditor(); }
}

function confirmarRecorte(){
  let srcCanvas=document.getElementById('capCanvas');
  let dstW=1200, dstH=1600;
  let dst=document.getElementById('workCanvas');
  dst.width=dstW; dst.height=dstH;
  let srcPts = puntos.map(p=>({x:p.x*srcCanvas.width, y:p.y*srcCanvas.height}));

  // perspective warp con OpenCV si existe
  if(typeof cv!=='undefined'){
    try{
      let srcMat=cv.imread(srcCanvas);
      let dstMat=new cv.Mat();
      let srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[srcPts[0].x,srcPts[0].y,srcPts[1].x,srcPts[1].y,srcPts[2].x,srcPts[2].y,srcPts[3].x,srcPts[3].y]);
      let dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,dstW,0,dstW,dstH,0,dstH]);
      let M=cv.getPerspectiveTransform(srcTri,dstTri);
      cv.warpPerspective(srcMat,dstMat,M,new cv.Size(dstW,dstH),cv.INTER_LINEAR,cv.BORDER_REPLICATE);
      cv.imshow(dst,dstMat);
      srcMat.delete(); dstMat.delete(); srcTri.delete(); dstTri.delete(); M.delete();
    }catch(e){
      // fallback simple draw
      dst.getContext('2d').drawImage(srcCanvas,0,0,dstW,dstH);
    }
  } else {
    dst.getContext('2d').drawImage(srcCanvas,0,0,dstW,dstH);
  }

  // filtro natural
  let ctx=dst.getContext('2d');
  let imgData=ctx.getImageData(0,0,dstW,dstH);
  let d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    if(filtroActual!=='original'){
      let v=r*0.299+g*0.587+b*0.114;
      if(filtroActual==='documento'){ v=(v-128)*1.7+128+10; v=v>200?255:v; }
      if(filtroActual==='bn'){ v=v>140?255:0; }
      if(filtroActual==='gris'){ v=Math.min(255,v*1.25); }
      d[i]=d[i+1]=d[i+2]=Math.max(0,Math.min(255,v));
    }
  }
  ctx.putImageData(imgData,0,0);
  paginas.push({src:dst.toDataURL('image/jpeg',0.88), filtro:filtroActual});
  renderGrid();
  cerrarEditor();
}

function renderGrid(){
  document.getElementById('gridPages').innerHTML=paginas.map((p,i)=>`<div class="page-card"><img src="${p.src}"><div class="page-num">${i+1}</div><div class="page-del" onclick="paginas.splice(${i},1);renderGrid()"><i class="fa-solid fa-xmark"></i></div></div>`).join('');
  document.getElementById('countPag').innerText=paginas.length+' hojas';
  document.getElementById('txtPag').innerText=paginas.length+' páginas';
}
async function generarPDF(){
  if(!paginas.length) return alert('Toma al menos una hoja');
  const {jsPDF}=window.jspdf; let pdf=new jsPDF('p','mm','a4');
  paginas.forEach((p,i)=>{ if(i>0) pdf.addPage(); pdf.addImage(p.src,'JPEG',0,0,210,297); });
  pdf.save(`Scanner_${Date.now()}.pdf`);
}
async function compartirWhatsApp(){
  if(!paginas.length) return;
  const {jsPDF}=window.jspdf; let pdf=new jsPDF('p','mm','a4');
  paginas.forEach((p,i)=>{ if(i>0) pdf.addPage(); pdf.addImage(p.src,'JPEG',0,0,210,297); });
  let blob=pdf.output('blob'); let file=new File([blob],`Documento.pdf`,{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({files:[file], title:'Documento escaneado'});
  } else {
    let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download='Documento.pdf'; a.click();
    setTimeout(()=>window.open('https://wa.me/?text=Te envío el PDF escaneado','_blank'),600);
  }
}
</script>
</body>
</html>
