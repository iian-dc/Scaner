<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CamScanner - HD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0a0a0a;color:#fff;max-width:500px;margin:0 auto}
.header{padding:14px 16px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
.camera{position:relative;width:100%;height:62vh;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover}
.guide{position:absolute;inset:7%;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,0.6)}
.controls{padding:16px;background:#111;display:flex;justify-content:center;gap:32px}
.btn-cap{width:84px;height:84px;background:#fff;border-radius:50%;border:8px solid #2a2a2a;color:#111;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(255,255,255,0.2)}
.btn-mini{width:48px;height:48px;background:#1e1e1e;border:1px solid #333;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center}
.filters{display:flex;gap:8px;padding:10px 12px;background:#151515;overflow-x:auto;border-top:1px solid #222}
.filter{padding:7px 14px;border-radius:20px;background:#1e1e1e;border:1.5px solid #333;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
.filter.active{background:#00ff88;color:#111;border-color:#00ff88}

#editor,#preview{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.edit-top{padding:12px 16px;background:#111;display:flex;justify-content:space-between;align-items:center}
.edit-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:#0f0f0f;padding:10px;overflow:hidden}
#editCanvas{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
.corner{position:absolute;width:32px;height:32px;background:#fff;border:3px solid #00ff88;border-radius:50%;transform:translate(-50%,-50%);z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.6)}
.pdf-wrap{flex:1;overflow-y:auto;background:#3a3a3a;padding:14px;display:flex;flex-direction:column;gap:14px;align-items:center}
.pdf-card{width:100%;max-width:380px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.5);position:relative}
.pdf-card img{width:100%;height:auto;display:block}
.pdf-tag{position:absolute;top:8px;left:8px;background:#111;color:#fff;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:800}
.actions{padding:12px;background:#111;display:flex;gap:10px;border-top:1px solid #222}
.btn{flex:1;padding:15px;border-radius:14px;border:none;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-c{background:#1e1e1e;color:#fff;border:1px solid #333}
.btn-s{background:#00ff88;color:#111}
.pages{padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.page{background:#fff;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:3/4;border:1px solid #222}
.page img{width:100%;height:100%;object-fit:contain;background:#fff}
.page-del{position:absolute;top:6px;right:6px;width:26px;height:26px;background:#ef4444;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.page-num{position:absolute;bottom:6px;left:6px;background:#111;color:#fff;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:800}
.bottom{position:sticky;bottom:0;background:#111;padding:12px;display:flex;gap:10px;border-top:1px solid #222}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><h1><i class="fa-solid fa-file-shield"></i> CamScanner HD</h1><span id="count" style="font-size:11px;background:#00ff88;color:#111;padding:4px 10px;border-radius:20px;font-weight:800">0 páginas</span></div>

<div class="camera"><video id="video" autoplay playsinline muted></video><div class="guide"></div></div>

<div class="controls">
  <button class="btn-mini" onclick="fileInput.click()"><i class="fa-solid fa-images"></i></button>
  <button class="btn-cap" onclick="tomarFoto()"><i class="fa-solid fa-camera"></i></button>
  <button class="btn-mini" onclick="cambiarCamara()"><i class="fa-solid fa-rotate"></i></button>
  <input id="fileInput" type="file" accept="image/*" hidden>
</div>

<div class="filters">
  <div class="filter active" data-m="magic" onclick="setMode('magic')"><i class="fa-solid fa-wand-magic-sparkles"></i> Magic Color</div>
  <div class="filter" data-m="bw" onclick="setMode('bw')">B&W Original</div>
  <div class="filter" data-m="light" onclick="setMode('light')">Aclarar</div>
  <div class="filter" data-m="original" onclick="setMode('original')">Foto</div>
</div>

<div class="pages">
  <div style="display:flex;justify-content:space-between"><b style="font-size:12px">DOCUMENTO HD - TIPO CAMSCANNER</b><span style="font-size:10px;color:#00ff88">Sin pérdida</span></div>
  <div class="grid" id="grid"></div>
</div>

<div class="bottom">
  <button class="btn btn-c" onclick="vistaPrevia()" style="background:#fff;color:#111"><i class="fa-solid fa-eye"></i> Ver PDF Real</button>
  <button class="btn btn-s" style="background:#25D366;color:#fff" onclick="vistaPrevia()"><i class="fa-brands fa-whatsapp"></i> Enviar HD</button>
</div>

<div id="editor">
  <div class="edit-top"><b style="font-size:12px">Recorte Auto - Centra la hoja</b><span style="font-size:10px;background:#00ff88;color:#111;padding:4px 8px;border-radius:20px">CamScanner</span></div>
  <div class="edit-wrap" id="editWrap"><canvas id="editCanvas"></canvas><div class="corner" id="p0"></div><div class="corner" id="p1"></div><div class="corner" id="p2"></div><div class="corner" id="p3"></div></div>
  <div class="actions"><button class="btn btn-c" onclick="cerrarEditor()">Cancelar</button><button class="btn btn-s" onclick="previewHD()"><i class="fa-solid fa-eye"></i> Ver resultado HD</button></div>
</div>

<div id="preview">
  <div class="edit-top"><b id="prevTitle" style="font-size:12px">Preview Real - Así se enviará</b><button onclick="preview.style.display='none'" style="background:#222;color:#fff;border:none;padding:6px 12px;border-radius:20px">X</button></div>
  <div class="pdf-wrap" id="pdfWrap"></div>
  <div class="actions"><button class="btn btn-c" id="btnBack">Volver</button><button class="btn btn-s" id="btnFinal"><i class="fa-solid fa-check"></i> Confirmar</button></div>
</div>

<canvas id="cap" class="hidden"></canvas>
<canvas id="work" class="hidden"></canvas>

<script>
let stream=null, facing='environment', paginas=[], puntos=[{x:0.07,y:0.07},{x:0.93,y:0.07},{x:0.93,y:0.93},{x:0.07,y:0.93}], imgOrig=null, drag=-1, mode='magic', tempHD=null;

async function iniciar(){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:3840},height:{ideal:2160}}}); video.srcObject=stream; } iniciar();
function cambiarCamara(){ facing=facing==='environment'?'user':'environment'; iniciar(); }
function setMode(m){ mode=m; document.querySelectorAll('.filter').forEach(f=>f.classList.remove('active')); document.querySelector(`[data-m="${m}"]`).classList.add('active'); if(tempHD) previewHD(); }

function tomarFoto(){ let c=cap; c.width=video.videoWidth; c.height=video.videoHeight; c.getContext('2d').drawImage(video,0,0); abrirEditor(c.toDataURL('image/jpeg',1.0)); }
fileInput.addEventListener('change', e=>{ let f=e.target.files[0]; let r=new FileReader(); r.onload=()=>abrirEditor(r.result); r.readAsDataURL(f); });

function abrirEditor(src){ imgOrig=new Image(); imgOrig.src=src; imgOrig.onload=()=>{ editor.style.display='flex'; setTimeout(()=>{ dibujar(); autoDetectar(); },80); } }
function cerrarEditor(){ editor.style.display='none'; }
function dibujar(){ let c=editCanvas, w=editWrap; let sc=Math.min((w.clientWidth-30)/imgOrig.width,(w.clientHeight-30)/imgOrig.height); c.width=imgOrig.width*sc; c.height=imgOrig.height*sc; c.getContext('2d').drawImage(imgOrig,0,0,c.width,c.height); actualizar(); }
function actualizar(){ let c=editCanvas; puntos.forEach((p,i)=>{ let el=document.getElementById('p'+i); el.style.left=(c.offsetLeft+p.x*c.width)+'px'; el.style.top=(c.offsetTop+p.y*c.height)+'px'; }); let ctx=c.getContext('2d'); ctx.drawImage(imgOrig,0,0,c.width,c.height); ctx.strokeStyle='#00ff88'; ctx.lineWidth=3; ctx.setLineDash([10,6]); ctx.beginPath(); ctx.moveTo(puntos[0].x*c.width,puntos[0].y*c.height); for(let i=1;i<4;i++) ctx.lineTo(puntos[i].x*c.width,puntos[i].y*c.height); ctx.closePath(); ctx.stroke(); }
document.querySelectorAll('.corner').forEach((el,i)=>{ el.addEventListener('touchstart',()=>drag=i); el.addEventListener('mousedown',()=>drag=i); });
window.addEventListener('touchmove', e=>{ if(drag==-1) return; let c=editCanvas,r=c.getBoundingClientRect(); puntos[drag]={x:(e.touches[0].clientX-r.left)/c.width,y:(e.touches[0].clientY-r.top)/c.height}; actualizar(); });
window.addEventListener('mousemove', e=>{ if(drag==-1) return; let c=editCanvas,r=c.getBoundingClientRect(); puntos[drag]={x:(e.clientX-r.left)/c.width,y:(e.clientY-r.top)/c.height}; actualizar(); });
window.addEventListener('touchend',()=>drag=-1); window.addEventListener('mouseup',()=>drag=-1);

function autoDetectar(){
  if(typeof cv==='undefined') return;
  try{
    let src=cv.imread(cap), gray=new cv.Mat(); cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
    let edges=new cv.Mat(); cv.Canny(gray,edges,50,150);
    let cont=new cv.MatVector(), hier=new cv.Mat(); cv.findContours(edges,cont,hier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    let maxA=0,best=null; for(let i=0;i<cont.size();i++){ let cnt=cont.get(i); let area=cv.contourArea(cnt); if(area>src.rows*src.cols*0.1 && area>maxA){ let peri=cv.arcLength(cnt,true); let ap=new cv.Mat(); cv.approxPolyDP(cnt,ap,0.02*peri,true); if(ap.rows==4){maxA=area; best=ap;} } }
    if(best){ let pts=[]; for(let i=0;i<4;i++) pts.push({x:best.data32S[i*2]/src.cols,y:best.data32S[i*2+1]/src.rows}); pts.sort((a,b)=>a.y-b.y); let t=pts.slice(0,2).sort((a,b)=>a.x-b.x), b=pts.slice(2,4).sort((a,b)=>a.x-b.x); puntos=[t[0],t[1],b[1],b[0]]; actualizar(); }
    src.delete(); gray.delete(); edges.delete(); cont.delete(); hier.delete();
  }catch(e){}
}

// MOTOR CAMSCANNER - Nitidez + Color
function aplicarCamScanner(canvas){
  let ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
  let img=ctx.getImageData(0,0,W,H), d=img.data;
  // 1. Filtro según modo
  for(let i=0;i<d.length;i+=4){
    let r=d[i], g=d[i+1], b=d[i+2];
    let v=r*0.299+g*0.587+b*0.114;
    if(mode==='magic'){
      // Magic Color: realza colores y blanquea fondo como CamScanner
      let avg=(r+g+b)/3;
      let sat=1.4; // saturación
      d[i]=Math.min(255, (r-avg)*sat+avg);
      d[i+1]=Math.min(255, (g-avg)*sat+avg);
      d[i+2]=Math.min(255, (b-avg)*sat+avg);
      // blanquea fondo
      if(v>180){ d[i]=d[i+1]=d[i+2]=255; } else { d[i]*=0.9; d[i+1]*=0.9; d[i+2]*=0.9; }
    } else if(mode==='bw'){
      let bw=v>130?255:0; d[i]=d[i+1]=d[i+2]=bw;
    } else if(mode==='light'){
      v=(v-128)*1.6+128+30; if(v>200) v=255; d[i]=d[i+1]=d[i+2]=Math.min(255,Math.max(0,v));
    } else if(mode==='original'){
      // solo mejora contraste ligero
    }
  }
  ctx.putImageData(img,0,0);
  // 2. Sharpen - nitidez como CamScanner
  if(mode!=='original'){
    let w=canvas.width, h=canvas.height;
    let src=ctx.getImageData(0,0,w,h), dst=ctx.createImageData(w,h);
    let kernel=[0,-1,0,-1,5,-1,0,-1,0];
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        let idx=(y*w+x)*4;
        let r=0,g=0,b=0;
        for(let ky=-1;ky<=1;ky++){
          for(let kx=-1;kx<=1;kx++){
            let kIdx=((y+ky)*w+(x+kx))*4;
            let kval=kernel[(ky+1)*3+(kx+1)];
            r+=src.data[kIdx]*kval; g+=src.data[kIdx+1]*kval; b+=src.data[kIdx+2]*kval;
          }
        }
        dst.data[idx]=Math.min(255,Math.max(0,r));
        dst.data[idx+1]=Math.min(255,Math.max(0,g));
        dst.data[idx+2]=Math.min(255,Math.max(0,b));
        dst.data[idx+3]=255;
      }
    }
    ctx.putImageData(dst,0,0);
  }
}

function procesarHD(){
  let srcC=cap, dst=work, W=2480, H=3508; // A4 300dpi HD real
  dst.width=W; dst.height=H;
  let pts=puntos.map(p=>({x:p.x*srcC.width,y:p.y*srcC.height}));
  try{
    let srcMat=cv.imread(srcC), dstMat=new cv.Mat();
    let s=cv.matFromArray(4,1,cv.CV_32FC2,[pts[0].x,pts[0].y,pts[1].x,pts[1].y,pts[2].x,pts[2].y,pts[3].x,pts[3].y]);
    let d=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W,0,W,H,0,H]);
    let M=cv.getPerspectiveTransform(s,d);
    cv.warpPerspective(srcMat,dstMat,M,new cv.Size(W,H),cv.INTER_CUBIC,cv.BORDER_REPLICATE);
    cv.imshow(dst,dstMat);
    srcMat.delete(); dstMat.delete(); s.delete(); d.delete(); M.delete();
  }catch(e){ dst.getContext('2d').drawImage(srcC,0,0,W,H); }
  aplicarCamScanner(dst);
  return dst.toDataURL('image/jpeg',1.0); // 100% sin pérdida
}

function previewHD(){
  tempHD=procesarHD();
  preview.style.display='flex';
  document.getElementById('prevTitle').innerText='Preview HD Real - Así quedará';
  pdfWrap.innerHTML=`<div class="pdf-card"><img src="${tempHD}"><div class="pdf-tag">HD - ${mode.toUpperCase()} - Sin borroso</div></div><div style="color:#fff;font-size:11px;background:#222;padding:10px 14px;border-radius:20px;text-align:center">Calidad CamScanner - Centrada y nítida ¿Guardar así?</div>`;
  btnBack.innerHTML='<i class="fa-solid fa-arrow-left"></i> Ajustar';
  btnBack.onclick=()=>preview.style.display='none';
  btnFinal.innerHTML='<i class="fa-solid fa-check"></i> Sí, guardar HD';
  btnFinal.onclick=()=>{ paginas.push(tempHD); render(); preview.style.display='none'; cerrarEditor(); };
}

function render(){ grid.innerHTML=paginas.map((s,i)=>`<div class="page"><img src="${s}"><div class="page-num">${i+1} HD</div><div class="page-del" onclick="paginas.splice(${i},1);render()"><i class="fa-solid fa-xmark"></i></div></div>`).join(''); count.innerText=paginas.length+' páginas HD'; }

function vistaPrevia(){
  if(!paginas.length) return alert('Toma una hoja primero');
  preview.style.display='flex';
  prevTitle.innerText=`PDF Real - ${paginas.length} páginas - Calidad HD`;
  pdfWrap.innerHTML=paginas.map((s,i)=>`<div class="pdf-card"><img src="${s}"><div class="pdf-tag">Página ${i+1} - HD Real</div></div>`).join('')+`<div style="color:#aaa;font-size:11px;padding:10px;text-align:center">Esto es exactamente como se enviará por WhatsApp - Sin borroso</div>`;
  btnBack.innerHTML='<i class="fa-solid fa-xmark"></i> Cerrar';
  btnBack.onclick=()=>preview.style.display='none';
  btnFinal.innerHTML='<i class="fa-brands fa-whatsapp"></i> Enviar HD por WhatsApp';
  btnFinal.onclick=async()=>{
    const {jsPDF}=window.jspdf;
    let pdf=new jsPDF('p','mm','a4');
    paginas.forEach((s,i)=>{ if(i>0) pdf.addPage(); pdf.addImage(s,'JPEG',0,0,210,297,undefined,'FAST'); });
    let blob=pdf.output('blob'), file=new File([blob],`CamScanner_HD_${Date.now()}.pdf`,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Documento HD'}); }
    else { let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=file.name; a.click(); setTimeout(()=>window.open('https://wa.me/?text=Te envío el documento en HD','_blank'),400); }
    preview.style.display='none';
  };
}
</script>
</body>
                                                                                                                                                                                </html>
